server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth routes
            - id: auth
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # User routes
            - id: user
              uri: http://localhost:8081
              predicates:
                - Path=/user/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # Book routes
            - id: books
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/books/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # Admin routes
            - id: admin
              uri: http://localhost:8081
              predicates:
                - Path=/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://dev-frontend-service"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

      filter:
        local-response-cache:
          enabled: true
          max-memory: 512MB
          ttl: 300
          request:
            methods:
              - GET
            headers:
              include:
                - Accept
                - Accept-Language

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: LocalResponseCache
              args:
                ttl: 300

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,loggers
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  health:
    redis:
      enabled: true
  info:
    java:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: ApiGateway
    version: 0.0.1-SNAPSHOT
    description: API Gateway for Library Management System

# Logging
logging:
  config: classpath:logback-spring.xml
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

# Gateway Cache
gateway:
  cache:
    enabled: true
    ttl: 300
