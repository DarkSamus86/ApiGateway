server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Frontend routes (root path)
            - id: frontend
              uri: http://dev-frontend-service:80
              predicates:
                - Path=/
              order: -1

            # Webjars
            - id: webjars
              uri: http://dev-library-service:80
              predicates:
                - Path=/webjars/**

            # Swagger UI
            - id: swagger-ui
              uri: http://dev-library-service:80
              predicates:
                - Path=/swagger-ui/**

            # API docs
            - id: api-docs
              uri: http://dev-library-service:80
              predicates:
                - Path=/v3/api-docs/**

            # Auth routes
            - id: auth
              uri: http://dev-library-service:80
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # User routes
            - id: user
              uri: http://dev-library-service:80
              predicates:
                - Path=/user/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # API routes (включая /api/v1/books)
            - id: api
              uri: http://dev-library-service:80
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

            # Admin routes
            - id: admin
              uri: http://dev-library-service:80
              predicates:
                - Path=/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@remoteAddrKeyResolver}"

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - RemoveResponseHeader=Server
            - AddResponseHeader=X-Frame-Options, DENY

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG